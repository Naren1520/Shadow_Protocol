[project]
name = "shadowprotocol-ai-services"
version = "0.1.0"
description = "AI/ML services for the ShadowProtocol Crime Intelligence Platform"
authors = ["ShadowProtocol Team"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.dependencies]
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.4.0"
python-dotenv = "^1.0.0"
langchain = "^0.1.0"
openai = "^1.3.0"
sentence-transformers = "^2.2.2"
nltk = "^3.8.1"
spacy = "^3.7.2"
faiss-cpu = "^1.7.4"
scikit-learn = "^1.3.2"
xgboost = "^2.0.1"
lightgbm = "^4.0.0"
numpy = "^1.24.3"
pandas = "^2.0.3"
aiohttp = "^3.9.0"
asyncpg = "^0.29.0"
prometheus-client = "^0.18.0"
python-json-logger = "^2.0.7"
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[tool.black]
line-length = 88

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"