services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ShadowProtocol@2026}
      POSTGRES_DB: shadowprotocol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shadowprotocol"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sp_network

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sp_network

  # ── Backend 
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: sp_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-ShadowProtocol@2026}@postgres:5432/shadowprotocol
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-shadowprotocol-jwt-secret-key-min-32-characters-here}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-shadowprotocol-refresh-secret-key-min-32-chars}
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      AI_SERVICE_URL: http://ai-services:3002
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-services:
        condition: service_started
    networks:
      - sp_network

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    container_name: sp_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sp_network

  # ── AI Services ──────────────────────────────────────────────────────────────
  ai-services:
    build:
      context: ./ai-services
      dockerfile: docker/Dockerfile
    container_name: sp_ai_services
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3002
      ALLOWED_ORIGINS: http://localhost:3000,http://backend:3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3002:3002"
    networks:
      - sp_network

volumes:
  postgres_data:
  redis_data:

networks:
  sp_network:
    driver: bridge
